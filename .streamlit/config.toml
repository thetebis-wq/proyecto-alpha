[theme]
primaryColor = "#00FFA3"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#1A1E29"
textColor = "#E0E3EB"
font = "sans serif"

[server]
port = 8501
headless = true
runOnSave = true
maxUploadSize = 50
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
